{% extends 'base.html' %}

{% block title %}Reset Password — AUTOVYNEX{% endblock %}

{% block content %}
<div class="container" style="padding-top:48px; padding-bottom:48px;">
  <div style="max-width:440px; margin:0 auto;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:60px; height:60px; border-radius:50%; background:rgba(2, 132, 199, 0.1); color:var(--color-primary); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
        <i data-lucide="key" style="width:30px; height:30px;"></i>
      </div>
      <h1 style="font-size:1.85rem; margin-bottom:6px;">Reset Password</h1>
      <p style="color:var(--text-muted); font-size:0.9rem;">Enter your email to receive a simulated recovery token.</p>
    </div>

    <div class="card">
      <form method="POST" action="{% url 'accounts:forgot_password' %}">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Registered Email Address *</label>
          <input type="email" name="email" required class="form-control" placeholder="name@example.com">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content:center;">
          <i data-lucide="mail"></i> Send Reset Link (Simulation)
        </button>
      </form>

      <div style="text-align:center; margin-top:20px; font-size:0.88rem;">
        <a href="{% url 'accounts:login' %}" style="color:var(--color-primary); font-weight:600;"><i data-lucide="arrow-left" style="width:14px; vertical-align:middle;"></i> Back to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
