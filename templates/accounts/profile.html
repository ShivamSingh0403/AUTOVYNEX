{% extends 'base.html' %}

{% block title %}Profile & Settings — AUTOVYNEX{% endblock %}

{% block content %}
<div class="container" style="padding-top:24px;">
  <div style="max-width:760px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
      <div>
        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:4px;">
          <a href="{% url 'dashboard:customer_dashboard' %}">Dashboard</a> / <span>Settings</span>
        </div>
        <h1 style="font-size:1.85rem; margin:0;">Account Settings & Coordinates</h1>
      </div>
    </div>

    <div class="card">
      <form method="POST" action="{% url 'accounts:profile_settings' %}">
        {% csrf_token %}
        <div class="grid-2" style="gap:20px; margin-bottom:16px;">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
          </div>
        </div>

        <div class="grid-2" style="gap:20px; margin-bottom:16px;">
          <div class="form-group">
            <label class="form-label">Email (Read Only)</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled style="background:var(--bg-surface-subtle); color:var(--text-muted);">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone" class="form-control" value="{{ profile.phone }}">
          </div>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">Default Shipping / Pickup Address</label>
          <textarea name="address" class="form-control" style="min-height:80px;">{{ profile.address }}</textarea>
        </div>

        <div class="grid-3" style="gap:16px; margin-bottom:24px;">
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control" value="{{ profile.city }}">
          </div>
          <div class="form-group">
            <label class="form-label">State</label>
            <input type="text" name="state" class="form-control" value="{{ profile.state }}">
          </div>
          <div class="form-group">
            <label class="form-label">Pincode</label>
            <input type="text" name="pincode" class="form-control" value="{{ profile.pincode }}">
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">
            <i data-lucide="save"></i> Save Profile Settings
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
